<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<style>
body{margin:0;background:#f2f3f5;color:#222;font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:12vh auto;padding:32px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
h1{margin:0 0 12px;font-size:22px}
dl{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;color:#555}
dt{font-weight:600}
dd{margin:0;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>{{title}}</h1>
<p>{{message}}</p>
<dl>
<dt>Your IP</dt><dd>{{ip}}</dd>
<dt>Reference</dt><dd>{{block_id}}</dd>
</dl>
</main>
</body>
</html>
